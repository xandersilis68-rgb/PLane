name: YPAD Heavy & Special Aircraft Tracker

on:
  schedule:
    - cron: '23 * * * *' # Automatically runs every hour at minute 23
  workflow_dispatch: # Puts a manual "Run Now" button in GitHub

permissions:
  contents: write # Allows the workflow to save and commit data.json back to the repository

jobs:
  check-flights-job:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Clone Code to Cloud
        uses: actions/checkout@v4

      - name: 2. Deploy Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Requirements
        run: pip install requests

      - name: 4. Execute Tracker with Cloud Secrets
        env:
          AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tracker.py

      - name: 5. Commit and Deploy data.json to GitHub Pages Environment
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add data.json
          # Check if there are changes before attempting to commit, preventing error crashes
          if git diff-index --quiet HEAD --; then
            echo "No structural movement updates in schedule parameters. Skipping update cycle."
          else
            git commit -m "🤖 Automate tracker engine telemetry sync [Skip GitHub Actions Actions]"
            git push origin main
          fi
